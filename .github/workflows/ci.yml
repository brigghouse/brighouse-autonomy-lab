name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests
      - name: Demo scan against the reference vehicle
        run: |
          python -m mavaudit.sim.fake_vehicle --mode unsigned --port 14550 --duration 12 &
          sleep 1
          python -m mavaudit scan --target udpin:127.0.0.1:14550 --duration 5 --active-probe --out demo/unsigned
          cat demo/unsigned.md
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ matrix.python }}
          path: demo/
